<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clirsmoke Hookah</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-card: #1a1a1a;
            --border: #2a2a2a;
            --text-primary: #fafafa;
            --text-muted: #a3a3a3;
            --accent: #c9a227;
            --accent-hover: #d4af37;
        }
        [data-theme="light"] {
            --bg-primary: #fafaf9;
            --bg-secondary: #f5f5f4;
            --bg-card: #ffffff;
            --border: #e7e5e4;
            --text-primary: #1c1917;
            --text-muted: #78716c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background 0.4s, color 0.4s;
        }
        .font-serif { font-family: 'Cormorant Garamond', serif; }
        .accent { color: var(--accent); }
        .bg-accent { background: var(--accent); }
        .border-accent { border-color: var(--accent); }
        /* 2-column grid on mobile */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        @media (min-width: 640px) {
            .product-grid { grid-template-columns: repeat(3, 1fr); gap: 20px; }
        }
        @media (min-width: 1024px) {
            .product-grid { grid-template-columns: repeat(4, 1fr); gap: 24px; }
        }
        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .product-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }
        [data-theme="light"] .product-card:hover {
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }
        .product-img-wrap {
            aspect-ratio: 1;
            position: relative;
            overflow: hidden;
            background: var(--bg-secondary);
        }
        .product-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s;
        }
        .product-card:hover .product-img-wrap img {
            transform: scale(1.05);
        }
        .img-thumbnails {
            display: flex;
            gap: 4px;
            position: absolute;
            bottom: 8px;
            left: 8px;
            right: 8px;
            justify-content: center;
        }
        .img-thumb {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            border: 2px solid transparent;
            cursor: pointer;
            object-fit: cover;
            transition: border-color 0.2s;
        }
        .img-thumb.active { border-color: var(--accent); }
        .theme-toggle {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .theme-toggle:hover { background: var(--bg-secondary); }
        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }
        .modal-overlay.open { opacity: 1; visibility: visible; }
        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            max-width: 480px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.95);
            transition: transform 0.3s;
        }
        .modal-overlay.open .modal-content { transform: scale(1); }
        .modal-gallery {
            aspect-ratio: 1;
            position: relative;
            background: var(--bg-secondary);
        }
        .modal-gallery img { width: 100%; height: 100%; object-fit: cover; }
        .modal-thumbs {
            display: flex;
            gap: 8px;
            padding: 12px;
            overflow-x: auto;
        }
        .modal-thumbs img {
            width: 56px;
            height: 56px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            flex-shrink: 0;
        }
        .modal-thumbs img.active { border-color: var(--accent); }
        /* Hero */
        .hero-slide {
            height: 280px;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
            padding: 24px;
        }
        @media (min-width: 640px) { .hero-slide { height: 400px; } }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .hero-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.75rem;
            font-weight: 600;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        @media (min-width: 640px) { .hero-title { font-size: 2.5rem; } }
        .filter-btn {
            padding: 8px 16px;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-primary);
            transition: all 0.2s;
        }
        .filter-btn:hover {
            background: var(--bg-secondary);
        }
        .filter-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }
        .category-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body class="pb-24">

    <!-- HEADER -->
    <header class="sticky top-0 z-40 border-b transition-colors" style="background: var(--bg-card); border-color: var(--border);">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="font-serif text-xl font-semibold tracking-wide">Clirsmoke</span>
                <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
                    <i data-lucide="sun" class="theme-icon-light w-5 h-5 hidden"></i>
                    <i data-lucide="moon" class="theme-icon-dark w-5 h-5"></i>
                </button>
            </div>
            <button onclick="checkout()" class="relative p-2 rounded-xl transition-colors" style="background: var(--bg-secondary);">
                <i data-lucide="shopping-bag" class="w-5 h-5" style="color: var(--text-muted);"></i>
                <span id="cart-count" class="absolute -top-1 -right-1 w-5 h-5 rounded-full flex items-center justify-center text-xs font-bold bg-accent text-black hidden">0</span>
            </button>
        </div>
    </header>

    <!-- HERO -->
    <div id="hero" class="relative overflow-hidden rounded-b-2xl mx-4 mb-6" style="max-height: 400px;">
        <div id="hero-slides" class="flex overflow-x-auto snap-x snap-mandatory scrollbar-hide" style="scroll-snap-type: x mandatory;">
            <!-- Injected -->
        </div>
    </div>

    <!-- PRODUCTS -->
    <div class="max-w-6xl mx-auto px-4">
        <h2 id="collection-title" class="font-serif text-2xl font-semibold mb-4">Our Collection</h2>
        <div id="category-filters" class="category-filters"></div>
        <div id="grid" class="product-grid">
            <!-- Injected -->
        </div>
    </div>

    <!-- FOOTER -->
    <footer id="footer" class="mt-16 pt-12 pb-8 border-t" style="border-color: var(--border); background: var(--bg-secondary);">
        <div class="max-w-6xl mx-auto px-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8 mb-8">
                <div>
                    <h3 id="footer-brand" class="font-serif text-xl font-semibold mb-3"></h3>
                    <p id="footer-about" class="text-sm" style="color: var(--text-muted);"></p>
                </div>
                <div id="footer-social-wrap">
                    <h4 class="font-semibold text-sm mb-3">Follow Us</h4>
                    <div id="footer-social" class="flex gap-3"></div>
                </div>
                <div id="footer-links-wrap">
                    <h4 class="font-semibold text-sm mb-3">Quick Links</h4>
                    <ul id="footer-links" class="space-y-2"></ul>
                </div>
            </div>
            <div class="pt-8 border-t text-center text-sm" style="color: var(--text-muted); border-color: var(--border);">
                <p id="footer-copyright"></p>
            </div>
        </div>
    </footer>

    <!-- AGE GATE -->
    <div id="age-gate" class="fixed inset-0 z-50 flex flex-col items-center justify-center p-8 text-center" style="background: var(--bg-primary);">
        <i data-lucide="shield-alert" class="w-16 h-16 mb-6" style="color: var(--accent);"></i>
        <h1 class="font-serif text-2xl font-bold mb-2">Age Verification</h1>
        <p class="mb-8" style="color: var(--text-muted);">You must be 18+ to enter this store.</p>
        <button onclick="closeAgeGate()" class="px-8 py-3 rounded-xl font-semibold transition-all hover:opacity-90 bg-accent text-black">I am 18 or older</button>
    </div>

    <!-- PRODUCT MODAL -->
    <div id="product-modal" class="modal-overlay" onclick="if(event.target===this)closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-gallery relative">
                <img id="modal-main-img" src="" alt="">
                <button onclick="closeModal()" class="absolute top-4 right-4 w-10 h-10 rounded-full flex items-center justify-center" style="background: rgba(0,0,0,0.5); color: white;">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div id="modal-thumbs" class="modal-thumbs hidden"></div>
            <div class="p-4 space-y-3">
                <div id="modal-cat" class="text-xs font-semibold uppercase tracking-wider" style="color: var(--accent);"></div>
                <h3 id="modal-name" class="font-serif text-xl font-semibold"></h3>
                <div id="modal-price" class="text-lg font-bold"></div>
                <div id="modal-variant-wrap" class="hidden">
                    <label class="text-sm font-medium block mb-2" id="modal-variant-label">Select option</label>
                    <select id="modal-variant-select" class="w-full py-2 px-3 rounded-lg border text-sm" style="background: var(--bg-secondary); border-color: var(--border);"></select>
                </div>
                <button id="modal-add-btn" onclick="addFromModal()" class="w-full py-3 rounded-xl font-semibold bg-accent text-black hover:opacity-90 transition">
                    Add to Order
                </button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        const STORAGE_KEY = 'clirsmoke_store_settings';
        const THEME_KEY = 'clirsmoke_theme';

        let ITEMS = [];
        let cart = [];
        let currentModalItem = null;
        let selectedCategory = 'All';

        function getTheme() {
            return localStorage.getItem(THEME_KEY) || 'dark';
        }
        function setTheme(t) {
            localStorage.setItem(THEME_KEY, t);
            document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : '');
            document.querySelector('.theme-icon-light').classList.toggle('hidden', t !== 'dark');
            document.querySelector('.theme-icon-dark').classList.toggle('hidden', t !== 'light');
        }
        function toggleTheme() {
            const next = getTheme() === 'dark' ? 'light' : 'dark';
            setTheme(next);
        }

        function loadData() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    const catalog = parsed.catalog || {};
                    ITEMS = [];
                    Object.keys(catalog).forEach(cat => {
                        (catalog[cat] || []).forEach(p => {
                            ITEMS.push({ ...p, cat, images: p.images || (p.img ? [p.img] : []), variants: p.variants || [], variantType: p.variantType || 'Option' });
                        });
                    });
                }
                if (ITEMS.length === 0) {
                    // Fallback demo data
                    ITEMS = [
                        { id: 1, name: "Khalil Mamoon", price: 450, cat: "Hookah", images: ["https://images.unsplash.com/photo-1635547821500-77542481940c?w=400"], variants: [], variantType: "Option" },
                        { id: 2, name: "Adalya Love 66", price: 80, cat: "Flavor", images: ["https://images.unsplash.com/photo-1527661591475-527312dd65f5?w=400"], variants: ["Mint", "Melon", "Mix"], variantType: "Flavor" },
                        { id: 3, name: "Vape 5000", price: 150, cat: "Vape", images: ["https://images.unsplash.com/photo-1629398775304-bf8309e3e20d?w=400"], variants: ["Blue Razz", "Grape", "Mango"], variantType: "Flavor" },
                    ];
                }
            } catch (e) {
                ITEMS = [];
            }
        }

        function getSite() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const d = JSON.parse(saved);
                    return { ...{ name: 'Clirsmoke', tagline: '', whatsapp: '233538865290', currency: 'GHS' }, ...d.site };
                }
            } catch (e) {}
            return { name: 'Clirsmoke', tagline: '', whatsapp: '233538865290', currency: 'GHS' };
        }

        function getHomepage() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const d = JSON.parse(saved);
                    return { ...{ collectionTitle: 'Our Collection', promo: '' }, ...d.homepage };
                }
            } catch (e) {}
            return { collectionTitle: 'Our Collection', promo: '' };
        }

        function getFooter() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const d = JSON.parse(saved);
                    return {
                        brand: d.footer?.brand || 'Clirsmoke',
                        copyright: d.footer?.copyright || '© 2025 Clirsmoke. All Rights Reserved.',
                        social: d.footer?.social || [],
                        links: d.footer?.links || []
                    };
                }
            } catch (e) {}
            return { brand: 'Clirsmoke', copyright: '© 2025 Clirsmoke. All Rights Reserved.', social: [], links: [] };
        }

        function getHero() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const d = JSON.parse(saved);
                    return d.hero || [];
                }
            } catch (e) {}
            return [{ title: 'Premium Hookah & Shisha', image: 'https://images.unsplash.com/photo-1635547821500-77542481940c?w=1200' }];
        }

        function getProductImages(item) {
            const imgs = item.images && item.images.length ? item.images : (item.img ? [item.img] : []);
            return imgs.filter(url => url && String(url).trim());
        }

        function openProductById(id) {
            const item = ITEMS.find(i => i.id === id);
            if (!item) return;
            currentModalItem = item;
            const imgs = getProductImages(item);
            document.getElementById('modal-main-img').src = imgs[0] || '';
            document.getElementById('modal-cat').textContent = item.cat || '';
            document.getElementById('modal-name').textContent = item.name || '';
            const site = getSite();
            document.getElementById('modal-price').textContent = `${site.currency || 'GHS'} ${item.price}`;
            const wrap = document.getElementById('modal-variant-wrap');
            const select = document.getElementById('modal-variant-select');
            if (item.variants && item.variants.length > 1) {
                wrap.classList.remove('hidden');
                document.getElementById('modal-variant-label').textContent = `Select ${item.variantType || 'Option'}`;
                select.innerHTML = item.variants.map(v => `<option value="${v}">${v}</option>`).join('');
            } else {
                wrap.classList.add('hidden');
            }
            const thumbs = document.getElementById('modal-thumbs');
            if (imgs.length > 1) {
                thumbs.innerHTML = imgs.map((url, i) => `<img src="${url}" class="${i === 0 ? 'active' : ''}" onclick="setModalImg(${i})" alt="">`).join('');
                thumbs.classList.remove('hidden');
                thumbs.style.display = 'flex';
            } else {
                thumbs.innerHTML = '';
                thumbs.classList.add('hidden');
                thumbs.style.display = 'none';
            }
            document.getElementById('product-modal').classList.add('open');
            lucide.createIcons();
        }

        function setModalImg(i) {
            const imgs = getProductImages(currentModalItem);
            if (imgs[i]) {
                document.getElementById('modal-main-img').src = imgs[i];
                document.querySelectorAll('#modal-thumbs img').forEach((el, j) => el.classList.toggle('active', j === i));
            }
        }

        function closeModal() {
            document.getElementById('product-modal').classList.remove('open');
        }

        function addFromModal() {
            if (!currentModalItem) return;
            const select = document.getElementById('modal-variant-select');
            const variant = select && select.offsetParent ? select.value : (currentModalItem.variants?.[0] || 'Standard');
            add(currentModalItem.id, variant);
            closeModal();
        }

        function add(id, variant) {
            const item = ITEMS.find(i => i.id === id);
            if (!item) return;
            cart.push({ ...item, flavor: variant });
            const badge = document.getElementById('cart-count');
            badge.innerText = cart.length;
            badge.classList.remove('hidden');
        }

        function checkout() {
            if (cart.length === 0) return;
            const site = getSite();
            const wa = (site.whatsapp || '').replace(/\D/g, '') || '233538865290';
            let msg = `💨 *${site.name || 'SMOKE'} ORDER*\n`;
            cart.forEach(i => msg += `• ${i.name} (${i.flavor || 'Standard'}) - ${site.currency || 'GHS'} ${i.price}\n`);
            msg += `Total: ${site.currency || 'GHS'} ${cart.reduce((a,b)=>a+b.price, 0)}`;
            window.open(`https://wa.me/${wa}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function closeAgeGate() {
            document.getElementById('age-gate').remove();
        }

        function renderHero() {
            const slides = getHero();
            const container = document.getElementById('hero-slides');
            if (!container) return;
            if (slides.length === 0) {
                container.innerHTML = `<div class="hero-slide min-w-full snap-center" style="background-image:url('https://images.unsplash.com/photo-1635547821500-77542481940c?w=1200')"><span class="hero-title">Premium Hookah & Shisha</span></div>`;
                return;
            }
            container.innerHTML = slides.map(s => `
                <div class="hero-slide min-w-full snap-center" style="background-image:url('${(s.image || '').replace(/"/g, '&quot;')}')">
                    <span class="hero-title text-white">${(s.title || '').replace(/</g, '&lt;')}</span>
                </div>
            `).join('');
        }

        function renderFooter() {
            const site = getSite();
            const footer = getFooter();
            const brandEl = document.getElementById('footer-brand');
            const aboutEl = document.getElementById('footer-about');
            const socialEl = document.getElementById('footer-social');
            const linksEl = document.getElementById('footer-links');
            const copyrightEl = document.getElementById('footer-copyright');
            const socialWrap = document.getElementById('footer-social-wrap');
            const linksWrap = document.getElementById('footer-links-wrap');
            if (brandEl) brandEl.textContent = footer.brand || site.name || 'Clirsmoke';
            if (aboutEl) aboutEl.textContent = site.about || '';
            if (copyrightEl) copyrightEl.textContent = footer.copyright || '';
            if (socialEl && footer.social.length) {
                socialEl.innerHTML = footer.social.map(s => `<a href="${(s.url || '#').replace(/"/g, '&quot;')}" target="_blank" rel="noopener" class="w-10 h-10 rounded-lg flex items-center justify-center transition hover:opacity-80" style="background: var(--bg-card); color: var(--text-primary);" aria-label="${(s.name || '').replace(/"/g, '&quot;')}"><i class="fa ${(s.icon || 'fa-link').replace(/"/g, '&quot;')}"></i></a>`).join('');
                if (socialWrap) socialWrap.style.display = '';
            } else if (socialWrap) socialWrap.style.display = 'none';
            if (linksEl && footer.links.length) {
                linksEl.innerHTML = footer.links.map(l => `<li><a href="${(l.url || '#').replace(/"/g, '&quot;')}" class="hover:underline" style="color: var(--text-muted);">${(l.text || '').replace(/</g, '&lt;')}</a></li>`).join('');
                if (linksWrap) linksWrap.style.display = '';
            } else if (linksWrap) linksWrap.style.display = 'none';
        }

        function getCategories() {
            const cats = [...new Set(ITEMS.map(i => i.cat).filter(Boolean))];
            return cats.sort((a, b) => a.localeCompare(b));
        }

        function setCategory(cat) {
            selectedCategory = cat;
            renderFilters();
            render();
        }

        function renderFilters() {
            const container = document.getElementById('category-filters');
            if (!container) return;
            const cats = getCategories();
            container.innerHTML = [
                ['All', 'All'],
                ...cats.map(c => [c, c])
            ].map(([label, val]) => `
                <button class="filter-btn ${selectedCategory === val ? 'active' : ''}" onclick="setCategory('${(val || '').replace(/'/g, "\\'")}')">${(label || '').replace(/</g, '&lt;')}</button>
            `).join('');
        }

        function render() {
            const site = getSite();
            const hp = getHomepage();
            const logoEl = document.querySelector('header .font-serif');
            if (logoEl) logoEl.textContent = site.name || 'Clirsmoke';
            document.title = (site.name || 'Clirsmoke') + ' Hookah';
            const collTitle = document.getElementById('collection-title');
            if (collTitle) collTitle.textContent = hp.collectionTitle || 'Our Collection';
            const grid = document.getElementById('grid');
            if (!grid) return;
            const filtered = selectedCategory === 'All' ? ITEMS : ITEMS.filter(i => i.cat === selectedCategory);
            grid.innerHTML = filtered.map(item => {
                const imgs = getProductImages(item);
                const mainImg = imgs[0] || 'https://via.placeholder.com/300?text=No+Image';
                const hasMulti = imgs.length > 1 || (item.variants && item.variants.length > 1);
                return `
                <div class="product-card snap-start">
                    <div class="product-img-wrap cursor-pointer" onclick="openProductById(${item.id})">
                        <img src="${mainImg.replace(/"/g, '&quot;')}" alt="${(item.name || '').replace(/"/g, '&quot;')}">
                        ${imgs.length > 1 ? `
                            <div class="img-thumbnails">
                                ${imgs.slice(0, 4).map((url, i) => `<img src="${url.replace(/"/g, '&quot;')}" class="img-thumb ${i === 0 ? 'active' : ''}" alt="">`).join('')}
                            </div>
                        ` : ''}
                    </div>
                    <div class="p-3">
                        <div class="text-[10px] font-semibold uppercase tracking-wider mb-1" style="color: var(--accent);">${(item.cat || '').replace(/</g, '&lt;')}</div>
                        <h3 class="font-semibold text-sm leading-tight mb-1 line-clamp-2">${(item.name || '').replace(/</g, '&lt;')}</h3>
                        <div class="font-bold text-base mb-2">${site.currency || 'GHS'} ${item.price}</div>
                        <button onclick="event.stopPropagation();${hasMulti ? `openProductById(${item.id})` : `add(${item.id}, '${(item.variants?.[0] || 'Standard').replace(/'/g, "\\'")}')`}" class="w-full py-2 rounded-lg text-sm font-semibold bg-accent text-black hover:opacity-90 transition">
                            ${hasMulti ? 'View Options' : 'Add to Order'}
                        </button>
                    </div>
                </div>
                `;
            }).join('');
        }

        setTheme(getTheme());
        loadData();
        renderHero();
        renderFilters();
        render();
        renderFooter();
        lucide.createIcons();
    </script>
</body>
</html>
