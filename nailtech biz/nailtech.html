<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polished by Akua | Luxury Nail Studio</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #faf8f6;
            --bg-secondary: #fff;
            --bg-card: #ffffff;
            --text-primary: #1a1614;
            --text-secondary: #5c534d;
            --text-muted: #8a8179;
            --accent: #a85d4a;
            --accent-soft: #e8d5d0;
            --border: #e8e4e0;
            --shadow: 0 4px 24px rgba(26,22,20,0.06);
            --shadow-hover: 0 12px 40px rgba(26,22,20,0.1);
        }
        [data-theme="dark"] {
            --bg-primary: #141210;
            --bg-secondary: #1c1917;
            --bg-card: #252220;
            --text-primary: #f5f2ef;
            --text-secondary: #c4bdb6;
            --text-muted: #7a736c;
            --accent: #d4a090;
            --accent-soft: #3d302a;
            --border: #2d2926;
            --shadow: 0 4px 24px rgba(0,0,0,0.3);
            --shadow-hover: 0 12px 40px rgba(0,0,0,0.4);
        }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background 0.3s ease, color 0.3s ease;
        }
        .serif { font-family: 'Cormorant Garamond', serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }
        @media (min-width: 768px) {
            .product-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (min-width: 1024px) {
            .product-grid { grid-template-columns: repeat(4, 1fr); }
        }
        .card-hover {
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }
        .img-zoom { transition: transform 0.5s ease; }
        .img-zoom:hover { transform: scale(1.05); }
        .theme-toggle circle { fill: var(--accent-soft); }
        .theme-toggle path { stroke: var(--accent); }
    </style>
</head>
<body class="pb-24">

    <!-- HEADER -->
    <header class="sticky top-0 z-40 border-b transition-colors duration-300" style="background: var(--bg-secondary); border-color: var(--border);">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex justify-between items-center">
            <div class="serif text-2xl font-bold tracking-tight" style="color: var(--accent);" id="header-brand">CLIRNAIL.</div>
            <div class="flex items-center gap-2">
                <button id="theme-toggle" class="p-2.5 rounded-full transition-colors duration-300 hover:opacity-80" style="background: var(--accent-soft); color: var(--accent);" aria-label="Toggle theme">
                    <svg class="w-5 h-5 theme-icon-sun" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                    <svg class="w-5 h-5 theme-icon-moon hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
                </button>
                <a id="header-insta" href="https://instagram.com" class="p-2.5 rounded-full transition-colors duration-300 hover:opacity-80" style="background: var(--accent-soft); color: var(--accent);" target="_blank" rel="noopener">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
                </a>
            </div>
        </div>
    </header>

    <!-- BIO SECTION -->
    <section class="max-w-6xl mx-auto px-4 sm:px-6 py-10 sm:py-14 text-center">
        <div class="w-28 h-28 sm:w-32 sm:h-32 mx-auto rounded-full overflow-hidden border-2 mb-5 transition-colors duration-300" style="border-color: var(--accent);">
            <img id="bio-avatar" src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&q=80&w=400" alt="" class="w-full h-full object-cover">
        </div>
        <h1 class="serif text-3xl sm:text-4xl font-bold mb-2" style="color: var(--text-primary);" id="bio-name">Hi, I'm Akua</h1>
        <p class="text-sm sm:text-base max-w-md mx-auto mb-8 transition-colors duration-300" style="color: var(--text-secondary);" id="bio-desc">Certified Nail Technician based in Spintex. I specialize in acrylics, biab, and intricate nail art.</p>
        <div class="inline-flex gap-10 sm:gap-14 py-5 px-8 rounded-2xl transition-colors duration-300" style="background: var(--bg-card); border: 1px solid var(--border);">
            <div>
                <div class="serif font-bold text-2xl" style="color: var(--accent);" id="stat-clients">500+</div>
                <div class="text-[10px] uppercase tracking-widest mt-1" style="color: var(--text-muted);">Clients</div>
            </div>
            <div>
                <div class="serif font-bold text-2xl" style="color: var(--accent);" id="stat-rating">4.9</div>
                <div class="text-[10px] uppercase tracking-widest mt-1" style="color: var(--text-muted);">Rating</div>
            </div>
            <div>
                <div class="serif font-bold text-2xl" style="color: var(--accent);" id="stat-exp">5yr</div>
                <div class="text-[10px] uppercase tracking-widest mt-1" style="color: var(--text-muted);">Exp.</div>
            </div>
        </div>
    </section>

    <!-- PRODUCTS -->
    <section class="max-w-6xl mx-auto px-4 sm:px-6">
        <h2 class="serif text-2xl sm:text-3xl font-bold mb-6" style="color: var(--text-primary);" id="section-title">The Collection</h2>
        <div id="products-container" class="product-grid"></div>
    </section>

    <!-- TESTIMONIALS -->
    <section class="mt-14 sm:mt-20 py-10 sm:py-14 transition-colors duration-300" style="background: var(--bg-card); border-top: 1px solid var(--border);">
        <h2 class="serif text-2xl sm:text-3xl font-bold text-center mb-8" style="color: var(--text-primary);" id="testimonials-title">Client Love</h2>
        <div class="flex overflow-x-auto gap-4 no-scrollbar pb-4 px-4 max-w-6xl mx-auto" id="testimonials-container"></div>
    </section>

    <!-- BOOKING MODAL -->
    <div id="booking-modal" class="fixed inset-0 z-50 hidden flex items-end sm:items-center justify-center p-4 transition-colors duration-300" style="background: rgba(0,0,0,0.5);">
        <div class="w-full max-w-sm rounded-2xl p-6 shadow-2xl animate-in slide-in-from-bottom sm:zoom-in-95 duration-300 max-h-[90vh] overflow-y-auto" style="background: var(--bg-card); border: 1px solid var(--border);">
            <div class="flex justify-between items-start mb-4">
                <div class="flex-1 min-w-0">
                    <div id="modal-image-wrap" class="rounded-xl overflow-hidden mb-3 aspect-[4/3] bg-black/5 hidden">
                        <img id="modal-image" src="" alt="" class="w-full h-full object-cover">
                        <div id="modal-image-dots" class="flex justify-center gap-1.5 mt-2"></div>
                    </div>
                    <h3 id="modal-title" class="serif text-xl font-bold" style="color: var(--text-primary);">Set Name</h3>
                    <p id="modal-price" class="font-semibold mt-1" style="color: var(--accent);">GHS 0</p>
                </div>
                <button type="button" onclick="toggleModal(false)" class="p-2 rounded-full transition-colors duration-300 hover:opacity-80 flex-shrink-0" style="background: var(--accent-soft); color: var(--accent);"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
            </div>
            <div class="space-y-4">
                <div id="modal-step-1">
                    <div id="modal-variants-container"></div>
                    <div>
                        <label class="text-xs font-semibold uppercase tracking-widest block mb-2" style="color: var(--text-muted);">Your Name</label>
                        <input id="client-name" type="text" class="w-full py-2.5 px-3 rounded-xl outline-none transition-colors duration-300" style="background: var(--bg-primary); border: 1px solid var(--border); color: var(--text-primary);" placeholder="Enter name">
                    </div>
                    <button type="button" onclick="showBookingStep2()" class="w-full py-3.5 rounded-xl font-semibold transition-all duration-300 hover:opacity-90" style="background: var(--accent); color: #fff;">Choose date & time</button>
                </div>
                <div id="modal-step-2" class="hidden">
                    <div class="mb-3">
                        <label class="text-xs font-semibold uppercase tracking-widest block mb-2" style="color: var(--text-muted);">Date</label>
                        <input id="booking-date" type="date" class="w-full py-2.5 px-3 rounded-xl outline-none transition-colors duration-300" style="background: var(--bg-primary); border: 1px solid var(--border); color: var(--text-primary);">
                    </div>
                    <div class="mb-3">
                        <label class="text-xs font-semibold uppercase tracking-widest block mb-2" style="color: var(--text-muted);">Available time</label>
                        <div id="booking-slots" class="flex flex-wrap gap-2 max-h-40 overflow-y-auto"></div>
                        <p id="booking-slots-empty" class="text-sm hidden mt-2" style="color: var(--text-muted);">Pick a date to see times, or no slots left that day.</p>
                    </div>
                    <div class="flex gap-2">
                        <button type="button" onclick="showBookingStep1()" class="flex-1 py-2.5 rounded-xl font-medium border transition-colors duration-300" style="border-color: var(--border); color: var(--text-secondary);">Back</button>
                        <button type="button" id="confirm-booking-btn" onclick="confirmBooking()" class="flex-1 py-3.5 rounded-xl font-semibold transition-all duration-300 hover:opacity-90 disabled:opacity-50 disabled:cursor-not-allowed" style="background: var(--accent); color: #fff;" disabled>Confirm & send to WhatsApp</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'nailtech_settings';
        const BOOKINGS_STORAGE_KEY = 'nailtech_bookings';

        const DEFAULT_CONFIG = {
            site: {
                brand: 'CLIRNAIL.',
                instagram: 'https://instagram.com',
                currency: 'GHS',
                whatsapp: '233538865290'
            },
            bookingSettings: {
                slotDurationMinutes: 30,
                businessHoursStart: '09:00',
                businessHoursEnd: '17:00',
                workingDays: [0, 1, 2, 3, 4, 5, 6]
            },
            bio: {
                name: "Hi, I'm Akua",
                description: "Certified Nail Technician based in Spintex. I specialize in acrylics, biab, and intricate nail art.",
                avatar: 'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&q=80&w=400',
                stats: { clients: '500+', rating: '4.9', exp: '5yr' }
            },
            sections: {
                collectionTitle: 'The Collection',
                testimonialsTitle: 'Client Love'
            },
            products: [
                { id: 1, name: "Marble French", price: 200, images: ["https://images.unsplash.com/photo-1698308233758-d55c98fd7444?q=80&w=735&auto=format&fit=crop"], hasVariants: true, variantLabel: "Shape", variants: ["Coffin", "Almond", "Square"] },
                { id: 2, name: "Classic Nude", price: 150, images: ["https://images.unsplash.com/photo-1604654894610-df63bc536371?auto=format&fit=crop&q=80&w=600"], hasVariants: true, variantLabel: "Shape", variants: ["Coffin", "Almond", "Square"] },
                { id: 3, name: "Ruby Red", price: 180, images: ["https://images.unsplash.com/photo-1648844421727-cde6c4246b13?q=80&w=680&auto=format&fit=crop"], hasVariants: false },
                { id: 4, name: "Glitter Ombre", price: 220, images: ["https://images.unsplash.com/photo-1522337660859-02fbefca4702?auto=format&fit=crop&q=80&w=600"], hasVariants: false },
                { id: 5, name: "Abstract Art", price: 250, images: ["https://images.unsplash.com/photo-1571290274554-6a2eaa771e5f?q=80&w=687&auto=format&fit=crop"], hasVariants: false },
                { id: 6, name: "Milky White", price: 160, images: ["https://images.unsplash.com/photo-1516975080664-ed2fc6a32937?auto=format&fit=crop&q=80&w=600"], hasVariants: false }
            ],
            testimonials: [
                { text: '"The best set I\'ve ever had. She is so gentle and the shaping is perfection!"', author: 'Sarah K.' },
                { text: '"Lasted 4 weeks without lifting. Akua is a magician."', author: 'Jessica M.' },
                { text: '"I have known Akua for like 2 years and she\'s my go to person for everything nails."', author: 'Abigail B.' },
                { text: '"She\'s a cool nail tech, I mean she asks what you want and do it like how you asked."', author: 'Sharon S.' }
            ]
        };

        let config = {};
        let selectedProduct = null;
        let selectedVariant = '';
        let selectedBookingDate = '';
        let selectedBookingTime = '';

        function loadConfig() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                config = raw ? { ...DEFAULT_CONFIG, ...JSON.parse(raw) } : JSON.parse(JSON.stringify(DEFAULT_CONFIG));
            } catch (e) {
                config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
            }
            if (!config.products || !Array.isArray(config.products)) config.products = DEFAULT_CONFIG.products;
            if (!config.testimonials || !Array.isArray(config.testimonials)) config.testimonials = DEFAULT_CONFIG.testimonials;
            if (!config.bookingSettings) config.bookingSettings = DEFAULT_CONFIG.bookingSettings;
        }

        function applyConfig() {
            const s = config.site || {};
            const b = config.bio || {};
            const sec = config.sections || {};
            document.getElementById('header-brand').textContent = s.brand || DEFAULT_CONFIG.site.brand;
            const insta = document.getElementById('header-insta');
            if (insta) insta.href = s.instagram || DEFAULT_CONFIG.site.instagram;
            document.getElementById('bio-avatar').src = b.avatar || DEFAULT_CONFIG.bio.avatar;
            document.getElementById('bio-name').textContent = b.name || DEFAULT_CONFIG.bio.name;
            document.getElementById('bio-desc').textContent = b.description || DEFAULT_CONFIG.bio.description;
            const st = b.stats || {};
            document.getElementById('stat-clients').textContent = st.clients ?? DEFAULT_CONFIG.bio.stats.clients;
            document.getElementById('stat-rating').textContent = st.rating ?? DEFAULT_CONFIG.bio.stats.rating;
            document.getElementById('stat-exp').textContent = st.exp ?? DEFAULT_CONFIG.bio.stats.exp;
            document.getElementById('section-title').textContent = sec.collectionTitle || DEFAULT_CONFIG.sections.collectionTitle;
            document.getElementById('testimonials-title').textContent = sec.testimonialsTitle || DEFAULT_CONFIG.sections.testimonialsTitle;
            renderProducts();
            renderTestimonials();
        }

        function renderProducts() {
            const container = document.getElementById('products-container');
            const currency = (config.site && config.site.currency) || 'GHS';
            const products = config.products || [];
            container.innerHTML = products.map(p => {
                const imgs = Array.isArray(p.images) && p.images.length ? p.images : (p.img ? [p.img] : ['https://via.placeholder.com/400?text=Nail+Set']);
                const mainImg = imgs[0];
                return `
                    <div onclick="openModal(${p.id})" class="rounded-2xl overflow-hidden cursor-pointer card-hover group" style="background: var(--bg-card); border: 1px solid var(--border); box-shadow: var(--shadow);">
                        <div class="relative aspect-[3/4] overflow-hidden">
                            <img src="${mainImg}" alt="${escapeHtml(p.name)}" class="w-full h-full object-cover img-zoom group-hover:scale-105">
                            ${imgs.length > 1 ? `<span class="absolute bottom-2 right-2 px-2 py-1 rounded-lg text-xs font-medium" style="background: var(--accent-soft); color: var(--accent);">${imgs.length} photos</span>` : ''}
                        </div>
                        <div class="p-3 sm:p-4">
                            <h4 class="font-semibold text-sm sm:text-base" style="color: var(--text-primary);">${escapeHtml(p.name)}</h4>
                            <p class="mt-1 font-semibold text-sm" style="color: var(--accent);">${currency} ${Number(p.price)}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderTestimonials() {
            const container = document.getElementById('testimonials-container');
            const list = config.testimonials || [];
            container.innerHTML = list.map(t => `
                <div class="min-w-[260px] sm:min-w-[280px] rounded-2xl p-6 flex-shrink-0 transition-colors duration-300" style="background: var(--bg-primary); border: 1px solid var(--border);">
                    <div class="flex gap-1 text-amber-500 mb-3">
                        ${[1,2,3,4,5].map(() => '<svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>').join('')}
                    </div>
                    <p class="text-sm italic" style="color: var(--text-secondary);">${escapeHtml(t.text)}</p>
                    <div class="text-xs font-semibold mt-4" style="color: var(--text-primary);">— ${escapeHtml(t.author)}</div>
                </div>
            `).join('');
        }

        function escapeHtml(s) {
            const div = document.createElement('div');
            div.textContent = s;
            return div.innerHTML;
        }

        function openModal(id) {
            selectedProduct = (config.products || []).find(p => p.id === id);
            if (!selectedProduct) return;
            const currency = (config.site && config.site.currency) || 'GHS';
            document.getElementById('modal-title').textContent = selectedProduct.name;
            document.getElementById('modal-price').textContent = `${currency} ${selectedProduct.price}`;
            const imgs = Array.isArray(selectedProduct.images) && selectedProduct.images.length ? selectedProduct.images : (selectedProduct.img ? [selectedProduct.img] : []);
            const imgWrap = document.getElementById('modal-image-wrap');
            const imgEl = document.getElementById('modal-image');
            const dotsEl = document.getElementById('modal-image-dots');
            if (imgs.length > 0) {
                imgWrap.classList.remove('hidden');
                imgEl.src = imgs[0];
                imgEl.alt = selectedProduct.name;
                if (imgs.length > 1) {
                    dotsEl.innerHTML = imgs.map((url, i) => `<button type="button" class="modal-dot w-2 h-2 rounded-full transition-all ${i === 0 ? 'opacity-100 scale-125' : 'opacity-40'}" style="background: var(--accent);" onclick="setModalImage(${i})" aria-label="Image ${i + 1}"></button>`).join('');
                    window._modalImages = imgs;
                    window._modalImageIndex = 0;
                } else {
                    dotsEl.innerHTML = '';
                }
            } else {
                imgWrap.classList.add('hidden');
            }
            const vContainer = document.getElementById('modal-variants-container');
            if (selectedProduct.hasVariants && selectedProduct.variants && selectedProduct.variants.length) {
                const label = selectedProduct.variantLabel || 'Option';
                vContainer.innerHTML = `
                    <div>
                        <label class="text-xs font-semibold uppercase tracking-widest block mb-2" style="color: var(--text-muted);">${escapeHtml(label)}</label>
                        <div class="flex flex-wrap gap-2">
                            ${selectedProduct.variants.map(v => `
                                <button type="button" onclick="setVariant('${escapeHtml(v)}')" class="variant-btn px-3 py-1.5 rounded-full text-sm border transition-colors duration-300" style="border-color: var(--border); color: var(--text-secondary);">${escapeHtml(v)}</button>
                            `).join('')}
                        </div>
                    </div>
                `;
                selectedVariant = '';
                updateVariantUI();
            } else {
                vContainer.innerHTML = '';
                selectedVariant = '';
            }
            selectedBookingDate = '';
            selectedBookingTime = '';
            document.getElementById('modal-step-1').classList.remove('hidden');
            document.getElementById('modal-step-2').classList.add('hidden');
            const today = new Date().toISOString().slice(0, 10);
            const dateInput = document.getElementById('booking-date');
            if (dateInput) { dateInput.value = ''; dateInput.min = today; }
            document.getElementById('confirm-booking-btn').disabled = true;
            toggleModal(true);
        }

        function setModalImage(i) {
            if (!window._modalImages || !window._modalImages[i]) return;
            document.getElementById('modal-image').src = window._modalImages[i];
            window._modalImageIndex = i;
            document.querySelectorAll('.modal-dot').forEach((dot, j) => {
                dot.classList.toggle('opacity-100', j === i);
                dot.classList.toggle('scale-125', j === i);
                dot.classList.toggle('opacity-40', j !== i);
            });
        }

        function setVariant(v) {
            selectedVariant = v;
            updateVariantUI();
        }

        function updateVariantUI() {
            document.querySelectorAll('.variant-btn').forEach(btn => {
                if (btn.textContent.trim() === selectedVariant) {
                    btn.style.background = 'var(--accent)';
                    btn.style.color = '#fff';
                    btn.style.borderColor = 'var(--accent)';
                } else {
                    btn.style.background = 'transparent';
                    btn.style.color = 'var(--text-secondary)';
                    btn.style.borderColor = 'var(--border)';
                }
            });
        }

        function toggleModal(show) {
            const el = document.getElementById('booking-modal');
            el.classList.toggle('hidden', !show);
            if (show) el.classList.add('flex'); else el.classList.remove('flex');
            if (!show) { selectedVariant = ''; selectedBookingTime = ''; selectedBookingDate = ''; }
        }

        function getBookings() {
            try {
                const raw = localStorage.getItem(BOOKINGS_STORAGE_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (e) { return []; }
        }

        function saveBookings(bookings) {
            localStorage.setItem(BOOKINGS_STORAGE_KEY, JSON.stringify(bookings));
        }

        function timeToMinutes(t) {
            const [h, m] = String(t).split(':').map(Number);
            return (h || 0) * 60 + (m || 0);
        }

        function getBookingSettings() {
            const b = config.bookingSettings || {};
            return {
                slotDurationMinutes: Number(b.slotDurationMinutes) || 30,
                businessHoursStart: b.businessHoursStart || '09:00',
                businessHoursEnd: b.businessHoursEnd || '17:00',
                workingDays: Array.isArray(b.workingDays) ? b.workingDays : [0, 1, 2, 3, 4, 5, 6]
            };
        }

        function getAvailableSlots(dateStr) {
            const { slotDurationMinutes, businessHoursStart, businessHoursEnd, workingDays } = getBookingSettings();
            const date = new Date(dateStr + 'T00:00:00');
            const day = date.getDay();
            if (!workingDays.includes(day)) return [];
            const startM = timeToMinutes(businessHoursStart);
            const endM = timeToMinutes(businessHoursEnd);
            const duration = slotDurationMinutes;
            const bookings = getBookings().filter(b => b.date === dateStr && (b.status !== 'cancelled'));
            const blocked = bookings.map(b => ({ start: timeToMinutes(b.time), end: timeToMinutes(b.time) + duration }));
            const slots = [];
            for (let m = startM; m + duration <= endM; m += duration) {
                const overlaps = blocked.some(({ start, end }) => m < end && m + duration > start);
                if (!overlaps) {
                    const h = Math.floor(m / 60);
                    const min = m % 60;
                    slots.push(`${String(h).padStart(2, '0')}:${String(min).padStart(2, '0')}`);
                }
            }
            return slots;
        }

        function renderBookingSlots() {
            const dateStr = document.getElementById('booking-date').value;
            const container = document.getElementById('booking-slots');
            const emptyEl = document.getElementById('booking-slots-empty');
            if (!dateStr) {
                container.innerHTML = '';
                emptyEl.classList.add('hidden');
                document.getElementById('confirm-booking-btn').disabled = true;
                return;
            }
            const slots = getAvailableSlots(dateStr);
            emptyEl.classList.toggle('hidden', slots.length > 0);
            container.innerHTML = slots.map(t => `
                <button type="button" class="slot-btn px-3 py-2 rounded-xl text-sm font-medium transition-colors duration-300 ${selectedBookingTime === t ? 'opacity-100' : ''}" style="border: 1px solid var(--border); color: var(--text-secondary); background: var(--bg-primary);" data-time="${t}">${formatTimeDisplay(t)}</button>
            `).join('');
            container.querySelectorAll('.slot-btn').forEach(btn => {
                btn.onclick = () => {
                    selectedBookingTime = btn.dataset.time;
                    document.querySelectorAll('.slot-btn').forEach(b => {
                        b.style.background = b.dataset.time === selectedBookingTime ? 'var(--accent)' : 'var(--bg-primary)';
                        b.style.color = b.dataset.time === selectedBookingTime ? '#fff' : 'var(--text-secondary)';
                        b.style.borderColor = b.dataset.time === selectedBookingTime ? 'var(--accent)' : 'var(--border)';
                    });
                    document.getElementById('confirm-booking-btn').disabled = false;
                };
            });
            if (!selectedBookingTime || !slots.includes(selectedBookingTime)) {
                selectedBookingTime = '';
                document.getElementById('confirm-booking-btn').disabled = true;
            }
        }

        function formatTimeDisplay(t) {
            const [h, m] = t.split(':').map(Number);
            const h12 = h % 12 || 12;
            const ampm = h < 12 ? 'am' : 'pm';
            return `${h12}:${String(m).padStart(2, '0')}${ampm}`;
        }

        function showBookingStep1() {
            document.getElementById('modal-step-1').classList.remove('hidden');
            document.getElementById('modal-step-2').classList.add('hidden');
        }

        function showBookingStep2() {
            const nameEl = document.getElementById('client-name');
            const name = nameEl && nameEl.value ? nameEl.value.trim() : '';
            if (!name) { alert('Please enter your name.'); return; }
            if (selectedProduct.hasVariants && selectedProduct.variants && selectedProduct.variants.length && !selectedVariant) {
                alert('Please pick a ' + (selectedProduct.variantLabel || 'option') + '.');
                return;
            }
            document.getElementById('modal-step-1').classList.add('hidden');
            document.getElementById('modal-step-2').classList.remove('hidden');
            selectedBookingDate = '';
            selectedBookingTime = '';
            document.getElementById('confirm-booking-btn').disabled = true;
            const today = new Date().toISOString().slice(0, 10);
            const dateInput = document.getElementById('booking-date');
            if (dateInput) dateInput.min = today;
            dateInput.value = '';
            document.getElementById('booking-slots').innerHTML = '';
            document.getElementById('booking-slots-empty').classList.add('hidden');
            dateInput.onchange = () => { selectedBookingDate = dateInput.value; selectedBookingTime = ''; renderBookingSlots(); };
        }

        function confirmBooking() {
            if (!selectedBookingDate || !selectedBookingTime) return;
            const nameEl = document.getElementById('client-name');
            const name = nameEl && nameEl.value ? nameEl.value.trim() : '';
            if (!name) return;
            const currency = (config.site && config.site.currency) || 'GHS';
            const bookings = getBookings();
            const id = Math.max(0, ...bookings.map(b => b.id || 0)) + 1;
            const booking = {
                id,
                date: selectedBookingDate,
                time: selectedBookingTime,
                name,
                productName: selectedProduct.name,
                productPrice: selectedProduct.price,
                variant: selectedVariant || null,
                createdAt: new Date().toISOString(),
                status: 'pending'
            };
            bookings.push(booking);
            saveBookings(bookings);
            const phone = (config.site && config.site.whatsapp) || DEFAULT_CONFIG.site.whatsapp;
            let msg = `💅 *NAIL APPOINTMENT*\n👤 Name: ${name}\n📅 Date: ${formatBookingDate(selectedBookingDate)}\n🕐 Time: ${formatTimeDisplay(selectedBookingTime)}\n🎨 Style: ${selectedProduct.name}\n💰 Price: ${currency} ${selectedProduct.price}`;
            if (selectedVariant) msg += `\n📏 ${selectedProduct.variantLabel || 'Option'}: ${selectedVariant}`;
            msg += `\n\nI've requested this slot via your website. Please confirm if available.`;
            window.open(`https://wa.me/${phone.replace(/\D/g, '')}?text=${encodeURIComponent(msg)}`, '_blank');
            toggleModal(false);
        }

        function formatBookingDate(ymd) {
            const d = new Date(ymd + 'T00:00:00');
            const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
            const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            return `${days[d.getDay()]}, ${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
        }

        // Theme
        function getTheme() {
            if (typeof localStorage !== 'undefined' && localStorage.getItem('nailtech_theme')) return localStorage.getItem('nailtech_theme');
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('nailtech_theme', theme);
            const sun = document.querySelector('.theme-icon-sun');
            const moon = document.querySelector('.theme-icon-moon');
            if (sun && moon) {
                sun.classList.toggle('hidden', theme === 'dark');
                moon.classList.toggle('hidden', theme !== 'dark');
            }
        }
        document.getElementById('theme-toggle').addEventListener('click', () => {
            setTheme(getTheme() === 'dark' ? 'light' : 'dark');
        });
        setTheme(getTheme());

        loadConfig();
        applyConfig();
    </script>
</body>
</html>
