<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Bag Edit</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #faf9f7;
            --bg-secondary: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #6b6b6b;
            --text-muted: #9ca3af;
            --accent: #b8860b;
            --accent-hover: #9a7209;
            --border: #e8e6e3;
            --card-shadow: 0 4px 24px rgba(0,0,0,0.06);
            --card-hover: 0 12px 40px rgba(0,0,0,0.12);
        }
        .dark {
            --bg-primary: #0d0d0d;
            --bg-secondary: #1a1a1a;
            --text-primary: #f5f5f5;
            --text-secondary: #a3a3a3;
            --text-muted: #737373;
            --accent: #d4af37;
            --accent-hover: #e8c547;
            --border: #2a2a2a;
            --card-shadow: 0 4px 24px rgba(0,0,0,0.3);
            --card-hover: 0 12px 40px rgba(0,0,0,0.5);
        }
        body { font-family: 'Outfit', sans-serif; background: var(--bg-primary); color: var(--text-primary); transition: background 0.4s, color 0.3s; }
        .serif { font-family: 'Cormorant Garamond', serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .product-img-carousel { scroll-snap-type: x mandatory; }
        .product-img-carousel img { scroll-snap-align: start; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.5s ease forwards; }
        .theme-toggle { transition: transform 0.3s ease; }
        .theme-toggle:hover { transform: rotate(15deg); }
    </style>
</head>
<body class="min-h-screen pb-24">

    <header class="sticky top-0 z-40 bg-[var(--bg-secondary)]/95 backdrop-blur-md border-b border-[var(--border)] transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="#" class="serif text-2xl md:text-3xl font-bold tracking-[0.15em] uppercase" id="site-name">The Bag Edit.</a>
            <p class="hidden sm:block text-[10px] text-[var(--text-muted)] uppercase tracking-[0.25em]" id="site-tagline">Luxury & High Street</p>
            <div class="flex items-center gap-3">
                <button onclick="toggleTheme()" class="theme-toggle p-2.5 rounded-full border border-[var(--border)] hover:border-[var(--accent)] text-[var(--text-secondary)] hover:text-[var(--accent)] transition-all" aria-label="Toggle theme">
                    <span class="dark:hidden"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span>
                    <span class="hidden dark:inline"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></span>
                </button>
                <a href="Adminpanel.html" class="p-2 rounded-full border border-[var(--border)] text-[var(--text-muted)] hover:text-[var(--accent)] transition-colors" title="Admin"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
            </div>
        </div>
    </header>

    <!-- Hero (optional, from admin) -->
    <div id="hero-section" class="hidden max-w-7xl mx-auto px-4 py-8 md:py-12">
        <div class="text-center">
            <h2 class="serif text-3xl md:text-5xl font-bold tracking-wide mb-2" id="hero-title"></h2>
            <p class="text-[var(--text-secondary)] text-sm md:text-base tracking-widest uppercase" id="hero-subtitle"></p>
        </div>
    </div>

    <!-- Brand filters -->
    <div class="flex gap-2 overflow-x-auto p-4 no-scrollbar justify-center flex-wrap" id="brand-filters">
        <!-- Injected -->
    </div>

    <!-- Product grid - 2 cols on mobile, more on larger screens -->
    <div id="grid" class="px-4 max-w-7xl mx-auto grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
        <!-- Injected -->
    </div>

    <!-- Product detail modal (for multi-image & variants) -->
    <div id="product-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/60 backdrop-blur-sm" onclick="closeModal(event)">
        <div class="bg-[var(--bg-secondary)] rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-[var(--border)] animate-in" onclick="event.stopPropagation()">
            <div class="relative">
                <button onclick="closeModal()" class="absolute top-4 right-4 z-10 p-2 rounded-full bg-black/30 hover:bg-black/50 text-white transition"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
                <div id="modal-images" class="aspect-[4/5] overflow-hidden flex overflow-x-auto product-img-carousel snap-x"></div>
                <div class="p-5">
                    <p id="modal-brand" class="text-[10px] font-semibold text-[var(--text-muted)] uppercase tracking-widest mb-1"></p>
                    <h3 id="modal-name" class="serif text-2xl font-bold mb-2"></h3>
                    <p id="modal-price" class="text-lg font-semibold text-[var(--accent)] mb-4"></p>
                    <div id="modal-variants" class="mb-4 hidden"></div>
                    <button id="modal-buy-btn" onclick="buyFromModal()" class="w-full py-3 bg-[var(--text-primary)] text-[var(--bg-primary)] font-semibold text-xs uppercase tracking-widest hover:opacity-90 transition">Purchase via WhatsApp</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="mt-16 py-12 border-t border-[var(--border)] bg-[var(--bg-secondary)]">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="serif text-xl font-semibold mb-2" id="footer-brand">The Bag Edit</p>
            <p class="text-sm text-[var(--text-muted)]" id="footer-about"></p>
            <p class="text-xs text-[var(--text-muted)] mt-6" id="footer-copyright">© 2025 The Bag Edit. All Rights Reserved.</p>
        </div>
    </footer>

    <script>
        const STORAGE_KEY = 'clirbags_settings';
        const DEFAULT_BAGS = [
            { id: 1, name: "Marmont Matelassé", brand: "Gucci", price: 2500, images: ["https://images.unsplash.com/photo-1548036328-c9fa89d128fa?auto=format&fit=crop&q=80&w=600"], variants: null },
            { id: 2, name: "Dionysus GG Small", brand: "Gucci", price: 4200, images: ["https://images.unsplash.com/photo-1594223274512-ad4803739b7c?auto=format&fit=crop&q=80&w=600"], variants: { "Color": ["Black", "Brown", "Beige"] } },
            { id: 3, name: "Jackie 1961 Hobo", brand: "Gucci", price: 3800, images: ["https://images.unsplash.com/photo-1681747685985-a401c271156c?q=80&w=1470&auto=format&fit=crop"], variants: null },
            { id: 4, name: "Horsebit 1955", brand: "Gucci", price: 4500, images: ["https://plus.unsplash.com/premium_photo-1680392544041-d89413b561ce?q=80&w=627"], variants: { "Color": ["Black", "Camel"] } },
            { id: 5, name: "Soho Disco Bag", brand: "Gucci", price: 2100, images: ["https://images.unsplash.com/photo-1523779105320-d1cd346ff52b?q=80&w=1473"], variants: null },
            { id: 6, name: "Ophidia GG Tote", brand: "Gucci", price: 3200, images: ["https://images.unsplash.com/photo-1590874103328-eac38a683ce7?auto=format&fit=crop&q=80&w=600"], variants: null },
            { id: 7, name: "Neverfull MM Tote", brand: "LV", price: 3200, images: ["https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&q=80&w=600"], variants: { "Color": ["Monogram", "Damier"] } },
            { id: 8, name: "Speedy 30 Bandoulière", brand: "LV", price: 2800, images: ["https://images.unsplash.com/photo-1691480288782-142b953cf664?q=80&w=880"], variants: null },
            { id: 9, name: "Alma BB Monogram", brand: "LV", price: 2500, images: ["https://images.unsplash.com/photo-1551106569-0411ddab8be9?q=80&w=687"], variants: null },
            { id: 10, name: "Pochette Métis", brand: "LV", price: 3600, images: ["https://images.unsplash.com/photo-1591561954557-26941169b49e?auto=format&fit=crop&q=80&w=600"], variants: null },
            { id: 11, name: "Onthego GM Tote", brand: "LV", price: 4100, images: ["https://images.unsplash.com/photo-1566150905458-1bf1fc113f0d?auto=format&fit=crop&q=80&w=600"], variants: null },
            { id: 12, name: "Capucines Mini", brand: "LV", price: 8500, images: ["https://images.unsplash.com/photo-1559563458-527698bf5295?q=80&w=1470"], variants: null },
            { id: 13, name: "Tabby Shoulder 26", brand: "Coach", price: 1800, images: ["https://images.unsplash.com/photo-1591561954557-26941169b49e?auto=format&fit=crop&q=80&w=600"], variants: { "Color": ["Black", "Chalk", "Camel"] } },
            { id: 14, name: "Willow Tote", brand: "Coach", price: 1200, images: ["https://images.unsplash.com/photo-1603290939650-b553549a5739?q=80&w=687"], variants: null },
            { id: 15, name: "Field Tote 22", brand: "Coach", price: 1500, images: ["https://images.unsplash.com/photo-1566150905458-1bf1fc113f0d?auto=format&fit=crop&q=80&w=600"], variants: null },
            { id: 16, name: "Beat Saddle Bag", brand: "Coach", price: 1400, images: ["https://images.unsplash.com/photo-1591561954557-26941169b49e?auto=format&fit=crop&q=80&w=600"], variants: null },
            { id: 17, name: "Pillow Tabby 18", brand: "Coach", price: 1600, images: ["https://images.unsplash.com/photo-1590874103328-eac38a683ce7?auto=format&fit=crop&q=80&w=600"], variants: null },
            { id: 18, name: "Rogue 25", brand: "Coach", price: 2200, images: ["https://images.unsplash.com/photo-1731510912565-1c2b6df339a7?q=80&w=687"], variants: null },
            { id: 19, name: "Classic Flap Bag", brand: "Chanel", price: 9500, images: ["https://images.unsplash.com/photo-1566150905458-1bf1fc113f0d?auto=format&fit=crop&q=80&w=600"], variants: null },
            { id: 20, name: "Lady Dior Mini", brand: "Dior", price: 6200, images: ["https://plus.unsplash.com/premium_photo-1670963025497-d6d582ea9319?q=80&w=880"], variants: null },
            { id: 21, name: "Cassette Bag", brand: "Bottega", price: 4800, images: ["https://images.unsplash.com/photo-1511598800709-141ed22fcefc?q=80&w=686"], variants: null },
            { id: 22, name: "Cleo Brushed", brand: "Prada", price: 3500, images: ["https://images.unsplash.com/photo-1590874103328-eac38a683ce7?auto=format&fit=crop&q=80&w=600"], variants: null },
            { id: 23, name: "Le Chiquito", brand: "Jacquemus", price: 1900, images: ["https://images.unsplash.com/photo-1512201078372-9c6b2a0d528a?q=80&w=1473"], variants: null },
            { id: 24, name: "Birkin 30", brand: "Hermès", price: 18500, images: ["https://images.unsplash.com/photo-1587599305803-01f1f176fbb4?q=80&w=1470"], variants: { "Color": ["Black", "Gold", "Étoupe"] } }
        ];

        let BAGS = [];
        let activeBrand = "All";
        let brands = ["All", "Gucci", "LV", "Coach", "Chanel", "Dior", "Bottega", "Prada", "Jacquemus", "Hermès"];
        let whatsapp = "233538665290";
        let currency = "GHS ";
        let modalProduct = null;
        let selectedVariant = {};

        function loadData() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const d = JSON.parse(saved);
                    if (d.products && Array.isArray(d.products) && d.products.length) {
                        BAGS = d.products.map(p => ({
                            ...p,
                            images: Array.isArray(p.images) ? p.images : (p.img ? [p.img] : ['']),
                            variants: p.variants || null
                        }));
                    } else BAGS = [...DEFAULT_BAGS];
                    if (d.brands && d.brands.length) brands = d.brands;
                    if (d.site?.whatsapp) whatsapp = d.site.whatsapp.replace(/\D/g, '') || whatsapp;
                    if (d.site?.currency) currency = d.site.currency.trim() + ' ';
                    applySiteContent(d);
                } else {
                    BAGS = [...DEFAULT_BAGS];
                    applySiteContent({});
                }
            } catch (e) {
                BAGS = [...DEFAULT_BAGS];
                applySiteContent({});
            }
            if (!brands.includes("All")) brands.unshift("All");
        }

        function applySiteContent(d) {
            document.getElementById('site-name').textContent = d.site?.name || 'The Bag Edit.';
            document.getElementById('site-tagline').textContent = d.site?.tagline || 'Luxury & High Street';
            document.getElementById('footer-brand').textContent = d.footer?.brand || 'The Bag Edit';
            document.getElementById('footer-about').textContent = d.site?.about || '';
            document.getElementById('footer-copyright').textContent = d.footer?.copyright || '© 2025 The Bag Edit. All Rights Reserved.';
            const heroTitle = d.mainPage?.heroTitle || d.hero?.[0]?.title;
            if (heroTitle) {
                document.getElementById('hero-section').classList.remove('hidden');
                document.getElementById('hero-title').textContent = heroTitle;
                document.getElementById('hero-subtitle').textContent = d.mainPage?.heroSubtitle || d.site?.tagline || '';
            }
        }

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('clirbags_theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        }

        function initTheme() {
            const saved = localStorage.getItem('clirbags_theme');
            if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches))
                document.documentElement.classList.add('dark');
        }

        function render() {
            const filtered = activeBrand === "All" ? BAGS : BAGS.filter(b => b.brand === activeBrand);
            const cur = currency;
            document.getElementById('grid').innerHTML = filtered.map((b, i) => {
                const imgs = Array.isArray(b.images) && b.images.length ? b.images : [b.img || ''];
                const img0 = imgs[0];
                const hasMulti = imgs.length > 1 || (b.variants && Object.keys(b.variants).length);
                return `
                <div class="group animate-in" style="animation-delay: ${i * 0.03}s">
                    <div class="bg-[var(--bg-secondary)] rounded-xl overflow-hidden shadow-[var(--card-shadow)] hover:shadow-[var(--card-hover)] transition-all duration-500 border border-[var(--border)]">
                        <div class="relative aspect-[4/5] overflow-hidden bg-[var(--border)]">
                            <img src="${img0}" alt="${(b.name||'').replace(/"/g,'&quot;')}" class="w-full h-full object-cover group-hover:scale-105 transition duration-700">
                            ${hasMulti ? `<span class="absolute bottom-2 right-2 px-2 py-0.5 bg-black/50 text-white text-[10px] rounded">${imgs.length} photos</span>` : ''}
                            <button class="absolute top-2 right-2 p-2 rounded-full bg-white/80 dark:bg-black/40 hover:bg-white dark:hover:bg-black/60 text-[var(--text-muted)] hover:text-red-500 transition" onclick="event.stopPropagation()"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></button>
                        </div>
                        <div class="p-3 md:p-4 text-center">
                            <div class="text-[10px] font-bold text-[var(--text-muted)] uppercase tracking-widest mb-1">${(b.brand||'').replace(/</g,'&lt;')}</div>
                            <h3 class="serif font-bold text-base md:text-lg leading-tight mb-2 line-clamp-2">${(b.name||'').replace(/</g,'&lt;')}</h3>
                            <p class="text-[var(--text-primary)] font-semibold mb-3">${cur}${b.price}</p>
                            <button onclick="openProductModal(${b.id})" class="w-full py-2.5 bg-[var(--text-primary)] text-[var(--bg-primary)] text-[10px] font-bold uppercase tracking-widest hover:opacity-90 transition rounded">Purchase</button>
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        function renderFilters() {
            document.getElementById('brand-filters').innerHTML = brands.map(b => `
                <button onclick="filter('${b.replace(/'/g,"\\'")}')" class="brand-btn shrink-0 px-4 py-2.5 rounded-full text-xs font-bold uppercase border transition whitespace-nowrap ${activeBrand === b ? 'border-[var(--accent)] bg-[var(--accent)] text-white' : 'border-[var(--border)] bg-[var(--bg-secondary)] text-[var(--text-secondary)] hover:border-[var(--accent)]'}">${b.replace(/</g,'&lt;')}</button>
            `).join('');
        }

        function filter(brand) {
            activeBrand = brand;
            renderFilters();
            render();
        }

        function openProductModal(id) {
            modalProduct = BAGS.find(b => b.id === id);
            if (!modalProduct) return;
            selectedVariant = {};
            const imgs = Array.isArray(modalProduct.images) && modalProduct.images.length ? modalProduct.images : [modalProduct.img || ''];
            document.getElementById('modal-images').innerHTML = imgs.map(url => `<img src="${url}" alt="" class="w-full h-full object-cover shrink-0 snap-center" style="min-width:100%">`).join('');
            document.getElementById('modal-brand').textContent = modalProduct.brand || '';
            document.getElementById('modal-name').textContent = modalProduct.name || '';
            document.getElementById('modal-price').textContent = currency + modalProduct.price;
            const vDiv = document.getElementById('modal-variants');
            if (modalProduct.variants && Object.keys(modalProduct.variants).length) {
                vDiv.classList.remove('hidden');
                vDiv.innerHTML = Object.entries(modalProduct.variants).map(([key, opts]) => `
                    <div class="mb-3">
                        <label class="block text-xs font-semibold text-[var(--text-secondary)] uppercase tracking-wider mb-2">${key}</label>
                        <div class="flex flex-wrap gap-2">
                            ${opts.map(o => `<button onclick="setVariant('${key}','${o}')" class="variant-btn px-3 py-1.5 rounded-full text-xs border border-[var(--border)] hover:border-[var(--accent)] ${(selectedVariant[key]===o)?'bg-[var(--accent)] text-white border-[var(--accent)]':''}">${o}</button>`).join('')}
                        </div>
                    </div>
                `).join('');
            } else vDiv.classList.add('hidden');
            document.getElementById('product-modal').classList.remove('hidden');
            document.getElementById('product-modal').classList.add('flex');
        }

        function setVariant(key, val) {
            selectedVariant[key] = val;
            document.querySelectorAll('.variant-btn').forEach(btn => {
                const vkey = btn.getAttribute('onclick')?.match(/setVariant\('([^']+)','([^']+)'\)/);
                if (vkey && vkey[1] === key) btn.className = `variant-btn px-3 py-1.5 rounded-full text-xs border ${selectedVariant[key]===vkey[2]?'bg-[var(--accent)] text-white border-[var(--accent)]':'border-[var(--border)] hover:border-[var(--accent)]'}`;
            });
        }

        function closeModal(e) {
            if (e && e.target !== document.getElementById('product-modal')) return;
            document.getElementById('product-modal').classList.add('hidden');
            document.getElementById('product-modal').classList.remove('flex');
        }

        function buyFromModal() {
            if (!modalProduct) return;
            let msg = `I want to buy: ${modalProduct.name} (${currency}${modalProduct.price})`;
            if (Object.keys(selectedVariant).length) msg += ' — ' + Object.entries(selectedVariant).map(([k,v])=>`${k}: ${v}`).join(', ');
            window.open(`https://wa.me/${whatsapp}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function buy(name, price) {
            window.open(`https://wa.me/${whatsapp}?text=${encodeURIComponent('I want to buy: ' + name + ' (' + currency + price + ')')}`, '_blank');
        }

        initTheme();
        loadData();
        renderFilters();
        render();
    </script>
</body>
</html>
